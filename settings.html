<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/settings.css">
</head>
<body>
  <p class="muted" id="status">正在读取配置…</p>

  <section>
    <h3>伙伴账号</h3>
    <table id="accounts"><thead><tr><th>账号</th><th>App</th><th>角色</th><th>私钥</th><th></th></tr></thead><tbody></tbody></table>
    <details id="account-form-box">
      <summary>添加或修改伙伴账号</summary>
      <div class="grid">
        <label>账号名<input id="acc-name" placeholder="ad" autocomplete="off"></label>
        <label>App 名称<input id="acc-app-name" placeholder="ADOppieXYZ" autocomplete="off"></label>
        <label>App slug<input id="acc-slug" placeholder="默认为 App 名称小写" autocomplete="off"></label>
        <label>App ID<input id="acc-app-id" inputmode="numeric" autocomplete="off"></label>
        <label>Installation ID<input id="acc-install-id" inputmode="numeric" autocomplete="off"></label>
        <label>角色<select id="acc-role">
          <option value="review">只读+评审</option>
          <option value="comment_review">只读+仅 COMMENT 评审</option>
          <option value="write">普通读写（不含管理员）</option>
        </select></label>
      </div>
      <fieldset><legend>可用操作（不勾选 = 按角色全部可用）</legend><div id="acc-ops" class="ops"></div></fieldset>
      <button id="acc-apply" type="button">放入待保存</button>
      <p class="muted">内置的 12 个账号身份写在代码里，只能在这里停用或启用，不能修改。</p>
    </details>
  </section>

  <section>
    <h3>仓库名单（good-night-oppie）</h3>
    <table id="repos"><thead><tr><th>仓库</th><th>ID</th><th>可选</th><th></th></tr></thead><tbody></tbody></table>
    <div class="grid">
      <label>仓库名<input id="repo-name" placeholder="MontClip" autocomplete="off"></label>
      <label>仓库 ID<input id="repo-id" inputmode="numeric" autocomplete="off"></label>
    </div>
    <button id="repo-add" type="button">放入待保存</button>
  </section>

  <section>
    <p id="pending" class="muted"></p>
    <button id="save" type="button" class="primary">保存（需要确认）</button>
    <button id="reload" type="button">放弃修改并重新读取</button>
  </section>

  <section>
    <h3>导入 App 私钥</h3>
    <p class="muted">私钥直接交给 Cindy 保险库，只在导入这一步注入插件后台；后台先向 GitHub 核对 App，再用本机 DPAPI 加密保存。导入结束后保险库里的副本会被清除。不要把私钥发给任何人。</p>
    <div class="grid">
      <label>账号<select id="key-account"></select></label>
      <label class="check"><input id="key-replace" type="checkbox">替换已保存的私钥</label>
    </div>
    <label>私钥（PEM）<textarea id="key-pem" rows="4" spellcheck="false" autocomplete="off" placeholder="-----BEGIN RSA PRIVATE KEY-----"></textarea></label>
    <button id="key-import" type="button">导入（需要确认）</button>
  </section>

  <p class="muted" id="message" role="status"></p>
  <script src="/settings.js"></script>
</body>
</html>

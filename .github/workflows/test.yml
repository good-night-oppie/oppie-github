name: source-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact test Python
        shell: bash
        run: python -c "import os,sys; f=open(os.environ['GITHUB_ENV'],'a'); f.write('OPPIE_TEST_PYTHON='+sys.executable+'\n'); f.close()"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:bundle
      - run: npm test
